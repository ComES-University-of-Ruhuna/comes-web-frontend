server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Vite-hashed assets — cache forever ───────────────────────────────
    # Vite outputs filenames like: assets/index-BfGyoCnK.js
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Static root files (favicons, manifest, robots.txt…) ──────────────
    location ~* \.(ico|png|svg|webp|jpg|jpeg|gif|woff2?|ttf|otf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ── SPA fallback — all unknown paths serve index.html ─────────────────
    # Mirrors the Vercel rewrite rule in vercel.json
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Disable access logs for health-check endpoint ────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── Hide Nginx version in error pages and headers ─────────────────────
    server_tokens off;
}
